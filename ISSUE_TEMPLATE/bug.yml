name: "Bug"
description: "Algo no funciona como se esperaba"
title: "[Bug] "
type: "Bug"
body:
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Resultado esperado
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Resultado actual
    validations:
      required: true
  - type: dropdown
    id: entorno
    attributes:
      label: Entorno
      options:
        - Producción
        - Staging
        - Local
    validations:
      required: true
  - type: dropdown
    id: severidad
    attributes:
      label: Severidad
      options:
        - Crítica (sistema caído o pérdida de datos)
        - Alta (función principal rota)
        - Media (hay alternativa)
        - Baja (cosmético)
    validations:
      required: true
  - type: textarea
    id: evidencia
    attributes:
      label: Evidencia
      description: "Capturas, logs o enlaces. No pegues contraseñas ni datos personales de clientes."
